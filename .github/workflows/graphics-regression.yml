name: Graphics foundation regression tests

on:
  push:
    branches:
      - feature/graphics-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphics-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout approved baseline for M5 comparison
        uses: actions/checkout@v4
        with:
          ref: dev/explorer-homecoming
          path: .m5-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Configure Chromium executable
        run: echo "CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Graphics foundation unit tests
        run: node tests/graphics-foundation.test.cjs
      - name: M2 character foundation unit tests
        run: node tests/character-renderer.test.cjs
      - name: M3 gimmick registry and animation tests
        run: node tests/gimmick-renderer.test.cjs
      - name: M4 environment registry and layer tests
        run: node tests/environment-renderer.test.cjs
      - name: M6 fantasy explorer skin tests
        run: node tests/fantasy-explorer.test.cjs
      - name: M6 skin settings browser tests
        run: node tests/explorer-skin-settings.cjs
      - name: M7 fantasy gimmick skin tests
        run: node tests/fantasy-gimmicks.test.cjs
      - name: M7 local graphics preview browser tests
        run: node tests/graphics-preview-qa.cjs
      - name: M8 fantasy environment tests
        run: node tests/fantasy-environments.test.cjs
      - name: M8 environment selector and preview browser tests
        run: node tests/environment-skin-settings.cjs
      - name: M8 Phase 3A homecoming skin regression
        run: node tests/homecoming-skin.test.cjs
      - name: M8 Phase 3B forest artwork tests
        run: node tests/forest-ruins-art.test.cjs
      - name: M9 Phase 1B explorer sprite tests
        run: node tests/explorer-sprite.test.cjs
      - name: M9 Phase 1C.1 approved forest integration tests
        run: node tests/approved-forest-image.test.cjs
      - name: M5 cross-branch visual and state comparison
        run: node tests/m5-visual-regression.cjs
      - name: Browser regression - live artwork
        id: artwork
        continue-on-error: true
        run: node tests/live-artwork.cjs
      - name: Browser regression - environments
        id: environments
        continue-on-error: true
        run: node tests/gameplay-environments.cjs
      - name: Browser regression - explorer
        id: explorer
        continue-on-error: true
        run: node tests/explorer-adventure.cjs
      - name: Browser regression - stage progression
        id: progression
        continue-on-error: true
        run: node tests/chapter-progression.cjs
      - name: Enforce browser regression results
        if: always()
        env:
          ARTWORK: ${{ steps.artwork.outcome }}
          ENVIRONMENTS: ${{ steps.environments.outcome }}
          EXPLORER: ${{ steps.explorer.outcome }}
          PROGRESSION: ${{ steps.progression.outcome }}
        run: |
          printf 'Browser test results: artwork=%s environments=%s explorer=%s progression=%s\\n' "$ARTWORK" "$ENVIRONMENTS" "$EXPLORER" "$PROGRESSION"
          test "$ARTWORK" = success && test "$ENVIRONMENTS" = success && test "$EXPLORER" = success && test "$PROGRESSION" = success
